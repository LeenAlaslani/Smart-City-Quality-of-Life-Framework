# CityPulse AI — Render Blueprint (two services).
# Place this file at the REPOSITORY ROOT to use "New + > Blueprint", or create
# the two services manually with the settings below. Paths are repo-root relative.
services:
  - type: web
    name: citypulse-backend
    runtime: docker
    plan: free
    rootDir: citypulse_platform/backend
    dockerfilePath: citypulse_platform/backend/Dockerfile
    dockerContext: citypulse_platform/backend
    healthCheckPath: /api/health
    autoDeployTrigger: off
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"

  - type: web
    name: citypulse-frontend
    runtime: static
    rootDir: citypulse_platform/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeployTrigger: off
    envVars:
      - key: VITE_API_BASE
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
